system: "You are a linguistics expert specializing in text classification. You receive a text excerpt and must determine whether it contains moralization according to the definition in the user prompt (true or false). You must also extract protagonists, assign each a category, and assign roles."
user: |+
    <task_description>

    <part_a>
    PART A: Determine whether moralization is present.

    Moralization must satisfy all three criteria:
    1. The text contains one or more moral values. Values may be positive (such as peace, safety, or support) or negative (such as injustice, unfairness, or insulting). They may be expressed by words or phrases, including nouns, adjectives, verbs, and evaluative descriptions.
    Use these Moral Foundations Theory categories where applicable: Care, Harm, Fairness, Cheating, Liberty, Oppression, Loyalty, Betrayal, Authority, Subversion, Purity and Degradation.
    2. The text contains a demand to do something, refrain from doing something, or adopt a particular attitude. A demand may be explicit or implicit.
       Implicit demands count only when they can be reconstructed beyond reasonable doubt from the context. If uncertain, answer false.
    3. The moral value supports or reinforces the demand argumentatively: because something is good or bad, it should be pursued, supported, avoided, or opposed.

    A moral value without a demand, a demand without a moral value, or unrelated values and demands do not constitute moralization.
    </part_a>

    <part_b>
    PART B: Extract protagonists.

    Extract all noun phrases referring to protagonists, including individuals, groups of people, institutions, organizations, parties, coalitions, countries, socially definable groups, and generic references such as the people or citizens.
    Do not annotate other references, such as adjectives modifying an entity. Annotate multiple protagonists separately. Pronouns referring to an already mentioned entity with the same role and group membership are not annotated. When the same entity is mentioned repeatedly, annotate only its first noun phrase. A pronoun may be annotated separately only when it refers to a different entity.
    </part_b>

    <part_c>
    PART C: Categorize protagonists.

    Assign exactly one category to each protagonist:
    - Individuals: a specific person.
    - Institutions: institutions, organizations, parties, coalitions, or countries when used as protagonists rather than locations.
    - Social Groups: a socially definable group, such as unemployed people, students, women, or parents.
    - Generic Human: people in general, such as people, the population, citizens, or residents.
    - OTHER: anything that does not fit another category.
    </part_c>

    <part_d>
    PART D: Assign roles in the moralization.

    If moralization is present, assign each protagonist one or more applicable roles:
    - Demander: the person or group making the demand.
    - Adressee: the person or group addressed by the demand.
    - Beneficiary: the person or group who benefits from the demand or currently suffers from the addressee's actions.
    - Maleficiary: the person or group negatively affected by the demand.
    - Unclear: clearly relevant, but the exact role is uncertain.
    - NONE: unrelated to the moralization.
    Multiple roles are allowed. Inclusive we/us normally refers to both the demand-maker and the addressee.
    </part_d>

        <examples>
        Keep the German text in these examples exactly as written; only the output labels are in English.

        - Text: "Wir sollten die Steuern erhöhen."
            Output:
            {{
                "moralization": {{
                        "moral_values": [ ],
                    "demand": "Wir sollten die Steuern erhöhen.",
                    "rationale": "Only an action is recommended; no moral value is given as a reason.",
                    "contains_moralization": false
                }},
                "protagonists": [{{"text": "Wir", "category": "Institutions", "roles": ["NONE"]}}]
            }}

        - Text: "Wir sollten die Steuern erhöhen, um die Armut zu bekämpfen und Gerechtigkeit zu schaffen."
            Output:
            {{
                "moralization": {{
                    "moral_values": [
                        {{"text": "Gerechtigkeit", "moral_foundations_theory_categories": ["Fairness", "Care"]}},
                        {{"text": "die Armut zu bekämpfen", "moral_foundations_theory_categories": ["Fairness", "Care"]}}
                    ],
                    "demand": "Wir sollten Steuern erhöhen.",
                    "rationale": "The demand is supported by the moral values justice and fighting poverty.",
                    "contains_moralization": true
                }},
                "protagonists": [{{"text": "Wir", "category": "Institutions", "roles": ["Demander", "Beneficiary", "Adressee"]}}]
            }}

        - Text: "Der Kranich ist ein Symbol für den Frieden."
            Output:
            {{
                "moralization": {{
                    "moral_values": [{{"text": "Frieden", "moral_foundations_theory_categories": ["Care"]}}],
                    "demand": "",
                    "rationale": "This only describes a symbolic fact and contains no morally supported demand.",
                    "contains_moralization": false
                }},
                "protagonists": []
            }}
        </examples>

    <questions>
    i) Explain whether the text contains moralization according to part_a.
    ii) Decide whether moralization is present and return true or false.
    iii) Extract, categorize, and assign roles to the protagonists according to parts_b through_d.
    </questions>

    <output_format>
    Return the strict JSON schema supplied by the API. Its top-level keys are
    moralization and protagonists. The moralization object contains moral_values,
    demand, rationale, and contains_moralization. Each moral value contains text
    and moral_foundations_theory_categories. Each protagonist contains text,
    category, and roles.
    </output_format>

    <text>
    {text}
    </text>
